{% extends "base.html" %}
{% block title %}Change Password{% endblock %}
{% block page_title %}Account Settings{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto; background: #f9fbfc; border-top: 4px solid var(--primary-blue);">
    <h3>Change Password</h3>
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label>Current (Old) Password *</label>
            <input type="password" name="old_password" required placeholder="Enter old password">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label>New Password *</label>
            <input type="password" name="new_password" required minlength="6" placeholder="At least 6 characters">
        </div>
        
        <div style="margin-bottom: 25px;">
            <label>Confirm New Password *</label>
            <input type="password" name="confirm_password" required minlength="6" placeholder="Re-type new password">
        </div>

        <button type="submit" class="btn" style="width: 100%; font-size: 16px;">Update Password</button>
        <a href="{{ url_for('dashboard') }}" class="btn" style="width: 100%; background: #666; margin-top: 10px; text-align: center; text-decoration: none;">Cancel</a>
    </form>
</div>
{% endblock %}
