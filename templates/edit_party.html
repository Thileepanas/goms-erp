{% extends "base.html" %}

{% block title %}Edit Party{% endblock %}
{% block page_title %}Edit Party{% endblock %}

{% block content %}
<div class="card">
    <h3>Edit Party Details</h3>
    <form method="POST">
        <div class="grid-3">
            <div>
                <label>Party Name *</label>
                <input name="party_name" id="party_name" value="{{ party['party_name'] }}" required>
            </div>
            <div>
                <label>Party Type *</label>
                <select name="party_type" required>
                    <option value="Debtor" {% if party['party_type'] == 'Debtor' %}selected{% endif %}>Debtor (Client)</option>
                    <option value="Creditor" {% if party['party_type'] == 'Creditor' %}selected{% endif %}>Creditor (Vendor)</option>
                </select>
            </div>
            <div>
                <label>Contact Number</label>
                <input name="contact_number" value="{{ party['contact_number'] or '' }}">
            </div>
            <div>
                <label>Email</label>
                <input type="email" name="email" value="{{ party['email'] or '' }}">
            </div>
            <div>
                <label>GSTIN</label>
                <!-- GSTIN-க்கு id, maxlength மற்றும் Uppercase சேர்க்கப்பட்டுள்ளது -->
                <input name="gstin" id="gstin" required value="{{ party['gstin'] or '' }}" maxlength="15" style="text-transform: uppercase;">
            </div>
            <div>
                <label>Opening Balance (₹)</label>
                <input type="number" name="opening_balance" step="0.01" value="{{ party['opening_balance'] }}">
            </div>
            <div style="grid-column: span 3;">
                <label>Address</label>
                <input name="address" id="address" value="{{ party['address'] or '' }}">
            </div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn">Update Party</button>
            <a href="{{ url_for('parties') }}" class="btn" style="background: #666;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const gstInput = document.getElementById('gstin');
        const nameInput = document.getElementById('party_name');
        const addressInput = document.getElementById('address');

        if (gstInput) {
            gstInput.addEventListener('blur', function() {
                const gstin = this.value.trim().toUpperCase();
                
                // GST எண் 15 டிஜிட் இருக்கான்னு செக் பண்றோம்
                if (gstin.length === 15) {
                    
                    nameInput.placeholder = "Fetching details...";
                    addressInput.placeholder = "Fetching details...";
                    nameInput.style.backgroundColor = "#f0f0f0";
                    addressInput.style.backgroundColor = "#f0f0f0";

                    fetch('/api/get-gst-details', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ gstin: gstin })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.legal_name) {
                            nameInput.value = data.legal_name;
                            addressInput.value = data.address;
                        } else {
                            alert('Invalid GSTIN or details not found.');
                        }
                        
                        nameInput.placeholder = "";
                        addressInput.placeholder = "";
                        nameInput.style.backgroundColor = "";
                        addressInput.style.backgroundColor = "";
                    })
                    .catch(error => {
                        console.error('Error fetching GST:', error);
                        alert('GST API Error. Please type the details manually.');
                        nameInput.placeholder = "";
                        addressInput.placeholder = "";
                        nameInput.style.backgroundColor = "";
                        addressInput.style.backgroundColor = "";
                    });
                }
            });
        }
    });
</script>
{% endblock %}
