{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}
{% block page_title %}Edit Project{% endblock %}

{% block content %}
<div class="card">
    <h3>Edit Project Details</h3>
    <form method="POST">
        <div class="grid-3">
            <div>
                <label>Project Name *</label>
                <input type="text" name="project_name" value="{{ project['project_name'] }}" required>
            </div>
            <div>
                <label>Client Name *</label>
                <select name="client_name" required>
                    <option value="">-- Select Client --</option>
                    {% for c in debtors %}
                        <option value="{{ c['party_name'] }}" {% if c['party_name'] == project['client_name'] %}selected{% endif %}>{{ c['party_name'] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>Work Order No</label>
                <input type="text" name="work_order" value="{{ project['work_order'] or '' }}">
            </div>
            <div>
                <label>Project Value (₹)</label>
                <!-- FIX: None-safe fallback -->
                <input type="number" name="project_value" step="0.01" value="{{ project['project_value'] or 0 }}">
            </div>
            <div>
                <label>Start Date</label>
                <input type="date" name="start_date" value="{{ project['start_date'] or '' }}">
            </div>
            <div>
                <label>Status</label>
                <select name="status">
                    <option value="Planning" {% if project['status'] == 'Planning' %}selected{% endif %}>Planning</option>
                    <option value="In Progress" {% if project['status'] == 'In Progress' %}selected{% endif %}>In Progress</option>
                    <option value="Completed" {% if project['status'] == 'Completed' %}selected{% endif %}>Completed</option>
                    <option value="On Hold" {% if project['status'] == 'On Hold' %}selected{% endif %}>On Hold</option>
                </select>
            </div>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button type="submit" class="btn">Update Project</button>
            <a href="{{ url_for('projects') }}" class="btn" style="background: #666;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
